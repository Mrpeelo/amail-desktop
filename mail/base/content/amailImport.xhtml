<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      lightweightthemes="true"
      scrolling="false">
<head>
  <title data-l10n-id="amail-import-title"></title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src chrome:; script-src chrome:; style-src chrome: 'unsafe-inline'" />
  <link rel="stylesheet" href="chrome://messenger/skin/messenger.css" />
  <link rel="stylesheet" href="chrome://messenger/skin/colors.css" />
  <link rel="stylesheet" href="chrome://messenger/skin/amailImport.css" />
  <link rel="localization" href="branding/brand.ftl" />
  <link rel="localization" href="messenger/amail.ftl" />
  <script type="module" src="chrome://messenger/content/amailImport.mjs"></script>
</head>
<body>
  <main id="importCard">
    <h1 data-l10n-id="amail-import-heading"></h1>
    <p data-l10n-id="amail-import-intro"></p>

    <fieldset id="profileGroup">
      <legend data-l10n-id="amail-import-choose"></legend>
      <div id="profileList" role="radiogroup"></div>
      <p id="noProfiles" class="dim" data-l10n-id="amail-import-none-found" hidden="hidden"></p>
      <button type="button" id="chooseFolder" class="btn" data-l10n-id="amail-import-choose-folder"></button>
    </fieldset>

    <p class="warning" data-l10n-id="amail-import-warning"></p>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <progress id="progress" max="100" value="0" hidden="hidden"></progress>

    <div class="actions">
      <button type="button" id="cancel" class="btn" data-l10n-id="amail-import-cancel"></button>
      <button type="button" id="import" class="btn primary" data-l10n-id="amail-import-start" disabled="disabled"></button>
    </div>
  </main>
</body>
</html>
